name: Wii U build (custom menu)

on:
  push:
    branches: [custom-menu]
  workflow_dispatch:

jobs:
  wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake ninja-build python3 curl ca-certificates
      - name: Install Wii U libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm wiiu-dev wiiu-portlibs || true
          for p in wiiu-sdl2 ppc-libzip ppc-tinyxml2 ppc-libopus ppc-opusfile ppc-libvorbis ppc-libogg ppc-zlib ppc-bzip2; do
            dkp-pacman -S --needed --noconfirm "$p" || echo "::warning::package $p not available"
          done
          ls $DEVKITPRO/portlibs/ppc/lib $DEVKITPRO/portlibs/wiiu/lib || true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          git config --global --add safe.directory '*'
          cmake -H. -Bbuild-wiiu -GNinja -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake -DCMAKE_BUILD_TYPE:STRING=Release
      - name: Build
        run: cmake --build build-wiiu --target soh_wuhb -j4 -- -k 0 2>&1 | tee build.log
        shell: bash -o pipefail {0}
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload soh.wuhb
        uses: actions/upload-artifact@v4
        with:
          name: soh-wiiu-custom-menu
          path: |
            build-wiiu/soh/soh.wuhb
            build-wiiu/soh/soh.rpx
